<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Eskul Jurnalistik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Absensi Eskul Jurnalistik</h1>
      <p class="subtitle" id="tanggal"></p>
    </header>

    <form id="formAbsen">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama kamu..." required>
      </div>

      <div class="form-group">
        <label for="kelas">Kelas</label>
        <select id="kelas" required>
          <option value="">-- Pilih Kelas --</option>
          <optgroup label="Kelas 10">
            <option value="10.1">10.1</option>
            <option value="10.2">10.2</option>
            <option value="10.3">10.3</option>
            <option value="10.4">10.4</option>
            <option value="10.5">10.5</option>
            <option value="10.6">10.6</option>
            <option value="10.7">10.7</option>
            <option value="10.8">10.8</option>
            <option value="10.9">10.9</option>
            <option value="10.10">10.10</option>
            <option value="10.11">10.11</option>
            <option value="10.12">10.12</option>
          </optgroup>
          <optgroup label="Kelas 11">
            <option value="11.1">11.1</option>
            <option value="11.2">11.2</option>
            <option value="11.3">11.3</option>
            <option value="11.4">11.4</option>
            <option value="11.5">11.5</option>
            <option value="11.6">11.6</option>
            <option value="11.7">11.7</option>
            <option value="11.8">11.8</option>
            <option value="11.9">11.9</option>
            <option value="11.10">11.10</option>
            <option value="11.11">11.11</option>
            <option value="11.12">11.12</option>
          </optgroup>
          <optgroup label="Kelas 12">
            <option value="12.1">12.1</option>
            <option value="12.2">12.2</option>
            <option value="12.3">12.3</option>
            <option value="12.4">12.4</option>
            <option value="12.5">12.5</option>
            <option value="12.6">12.6</option>
            <option value="12.7">12.7</option>
            <option value="12.8">12.8</option>
            <option value="12.9">12.9</option>
            <option value="12.10">12.10</option>
            <option value="12.11">12.11</option>
            <option value="12.12">12.12</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label>Status Kehadiran</label>
        <div class="status-buttons">
          <button type="button" class="status-btn hadir" data-status="Hadir">Hadir</button>
          <button type="button" class="status-btn izin" data-status="Izin">Izin</button>
          <button type="button" class="status-btn sakit" data-status="Sakit">Sakit</button>
          <button type="button" class="status-btn alpha" data-status="Alpha">Alpha</button>
        </div>
        <input type="hidden" id="status" required>
      </div>

      <div class="form-group">
        <label for="keterangan">Keterangan (opsional)</label>
        <input type="text" id="keterangan" placeholder="Alasan izin/sakit...">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Kirim Absensi</button>
    </form>

    <div id="pesan" class="pesan"></div>

    <div class="footer-koran">— Eskul Jurnalistik • Absensi Harian —</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
